<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff2a8">
  <meta name="description" content="子どもの絵をイラストにして動くGIFを作るウェブアプリ">
  <title>おえかきジャンプ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./screen.css">
</head>
<body>
  <main class="poster-stage" id="posterStage" aria-label="おえかきジャンプ">
    <!-- 静的な装飾・イラストは元画像をそのまま使う -->
    <img class="poster-image" src="./oekaki-jump.png" width="864" height="1536" alt="おえかきジャンプのメイン画面">

    <!-- 操作が必要な部分だけ実DOMを重ねる -->
    <a class="hit settings-hit" href="./settings.html" aria-label="設定を開く"><span class="sr-only">設定</span></a>

    <button id="cameraBtn" class="hit camera-hit" type="button" aria-label="カメラで撮る"><span class="sr-only">カメラで撮る</span></button>
    <label class="hit gallery-hit" aria-label="画像を選ぶ">
      <input id="galleryInput" class="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/*">
      <span class="sr-only">画像を選ぶ</span>
    </label>
    <input id="cameraFallback" class="file-input" type="file" accept="image/*" capture="environment">

    <div id="previewWrap" class="preview-overlay hidden" aria-live="polite">
      <img id="preview" alt="選択した画像">
      <button id="clearImage" class="preview-clear" type="button" aria-label="画像を取り消す">×</button>
    </div>
    <div id="samplePreview" class="hidden" aria-hidden="true"></div>

    <!-- 6枚の見た目は元画像から切り出した素材。選択状態だけHTML/CSSで動かす -->
    <div id="motionList" class="motion-live-grid" aria-label="動きを選ぶ"></div>

    <!-- スライダーは完全にHTML/CSS。ノブが実際に動く -->
    <div class="slider-live strength-live">
      <div class="slider-title"><span class="slider-symbol resize-symbol">↗↙</span><strong>動きの大きさ</strong></div>
      <input id="motionStrength" type="range" min="50" max="150" value="100" step="10" aria-label="動きの大きさ">
      <div class="slider-labels"><span>やさしめ</span><span>大きめ</span></div>
      <span id="motionStrengthLabel" class="sr-only">ふつう</span>
    </div>
    <div class="slider-live speed-live">
      <div class="slider-title"><span class="slider-symbol">◔</span><strong>動きの速さ</strong></div>
      <input id="motionSpeed" type="range" min="70" max="150" value="100" step="10" aria-label="動きの速さ">
      <div class="slider-labels"><span>ゆっくり</span><span>はやい</span></div>
      <span id="motionSpeedLabel" class="sr-only">ふつう</span>
    </div>

    <button id="create" class="hit create-hit" type="button" disabled aria-label="イラストとGIFを作る"><span class="sr-only">イラストとGIFを作る</span></button>

    <div id="apiState" class="sr-only">API設定を確認中…</div>
    <div id="promptState" class="sr-only"></div>
    <a id="goSettings" class="sr-only hidden" href="./settings.html">API設定を開く</a>

    <div id="status" class="toast status-toast hidden" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <div><strong id="statusTitle">作成中…</strong><p id="statusText">少し時間がかかることがあります。</p></div>
    </div>
    <div id="error" class="toast error-toast hidden" role="alert"></div>

    <!-- 生成後は元画像の結果エリアと同じ位置を実データで置き換える -->
    <section id="resultsWrap" class="results-overlay hidden" aria-label="生成結果">
      <div class="generated-result png-result-box">
        <img id="pngResult" alt="完成した背景透過イラスト">
      </div>
      <a id="pngDownload" class="live-save png-save" download="illustration.png" href="#" aria-label="PNGを保存">⇩ 保存</a>

      <div class="generated-result gif-result-box">
        <img id="gifResult" alt="動く背景透過GIF">
      </div>
      <a id="gifDownload" class="live-save gif-save" download="animation.gif" href="#" aria-label="GIFを保存">⇩ 保存</a>
      <p id="motionSummary" class="sr-only"></p>
    </section>
  </main>

  <div id="cameraModal" class="camera-modal hidden" role="dialog" aria-modal="true" aria-label="カメラ">
    <div class="camera-panel">
      <div class="camera-head">
        <strong>カメラで撮影</strong>
        <button id="cameraClose" type="button" aria-label="閉じる">×</button>
      </div>
      <video id="cameraVideo" autoplay playsinline muted></video>
      <canvas id="cameraCanvas" class="hidden"></canvas>
      <div class="camera-buttons">
        <button id="switchCamera" class="secondary" type="button">前/後を切替</button>
        <button id="takePhoto" class="shutter" type="button" aria-label="撮影">撮影</button>
      </div>
      <p id="cameraMessage" class="camera-message">カメラの使用を許可してください。</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized@1.0.1/dist/gif.js"></script>
  <script src="./app.js"></script>
</body>
</html>
